```
<div class="glass-card form-card">

  <h1>Help & Support</h1>

  <p class="subtitle">
    Facing challenges during evangelism? Let church leadership know how we can support you.
  </p>

  <form id="helpForm">

    <div class="form-group">
      <input
        type="text"
        name="fullName"
        placeholder="Full Name"
        required
      >
    </div>

    <div class="form-group">
      <input
        type="text"
        name="phone"
        placeholder="Phone Number"
        required
      >
    </div>

    <div class="form-group">
      <input
        type="text"
        name="area"
        placeholder="Area / Location"
      >
    </div>

    <div class="form-group">
      <select
        name="challengeType"
        required
      >
        <option value="">
          Challenge Type
        </option>

        <option>
          Rejection During Evangelism
        </option>

        <option>
          Difficult Questions
        </option>

        <option>
          Follow-Up Challenges
        </option>

        <option>
          Safety Concerns
        </option>

        <option>
          Spiritual Challenges
        </option>

        <option>
          Lack of Response
        </option>

        <option>
          Other
        </option>

      </select>
    </div>

    <div class="form-group">
      <select
        name="urgency"
        required
      >
        <option value="">
          Urgency Level
        </option>

        <option>
          Low
        </option>

        <option>
          Medium
        </option>

        <option>
          High
        </option>

        <option>
          Emergency
        </option>

      </select>
    </div>

    <div class="form-group">
      <textarea
        name="description"
        placeholder="Describe your challenge in detail"
        required
      ></textarea>
    </div>

    <button
      type="submit"
      class="submit-btn"
    >
      Request Assistance
    </button>

  </form>

  <br>

  <a
    href="index.html"
    class="secondary-btn"
  >
    Back Home
  </a>

</div>
```

  </div>

  <script>

    const scriptURL =
      "PASTE_YOUR_HELP_API_URL_HERE";

    const form =
      document.getElementById(
        "helpForm"
      );

    form.addEventListener(
      "submit",
      async function(e){

        e.preventDefault();

        const button =
          document.querySelector(
            ".submit-btn"
          );

        button.innerText =
          "Sending Request...";

        button.disabled = true;

        const formData =
          new FormData(form);

        const data =
          Object.fromEntries(
            formData.entries()
          );

        try {

          const response =
            await fetch(
              scriptURL,
              {
                method: "POST",

                body:
                  JSON.stringify(data)
              }
            );

          const result =
            await response.json();

          if(result.success){

            window.location.href =
              "success.html";

          }

          else {

            alert(
              "Request failed. Please try again."
            );

          }

        }

        catch(error){

          console.error(error);

          alert(
            "Request failed. Please try again."
          );

        }

        button.innerText =
          "Request Assistance";

        button.disabled = false;

      }
    );

  </script>

</body>

</html>
